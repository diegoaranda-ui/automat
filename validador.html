<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador — Kavak Supply</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;
  background:#f8fafc;color:#0f172a;-webkit-font-smoothing:antialiased}
:root{
  --n0:#fff;--n50:#f8fafc;--n100:#f1f5f9;--n200:#e2e8f0;--n300:#cbd5e1;
  --n400:#94a3b8;--n500:#64748b;--n700:#334155;--n900:#0f172a;
  --b500:#3b82f6;--b600:#2563eb;--b50:#eff6ff;--b200:#bfdbfe;
  --g50:#f0fdf4;--g500:#22c55e;--g600:#16a34a;--g200:#bbf7d0;
  --r50:#fef2f2;--r500:#ef4444;--r600:#dc2626;--r200:#fecaca;
  --a50:#fffbeb;--a600:#d97706;--a200:#fde68a;
  --pu:#af52de;--pu50:rgba(175,82,222,.08);--pu200:rgba(175,82,222,.25);
  --mono:'JetBrains Mono',monospace;
}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 60px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.head-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#af52de,#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:0 4px 12px rgba(175,82,222,.35)}
.head-t{font-size:20px;font-weight:800;letter-spacing:-.5px}
.head-s{font-size:12px;color:var(--n400);margin-top:1px}
.card{background:var(--n0);border:1px solid var(--n200);border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--n500);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.in-row{display:flex;gap:8px}
.in{flex:1;background:var(--n50);border:1.5px solid var(--n200);border-radius:10px;padding:12px 14px;font-size:18px;
  font-family:var(--mono);font-weight:600;color:var(--n900);outline:none;letter-spacing:1px;transition:.15s;text-transform:uppercase}
.in:focus{border-color:var(--b500);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.in::placeholder{color:var(--n300);letter-spacing:0;text-transform:none}
.btn{padding:0 16px;border-radius:10px;border:none;background:var(--n900);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--b600)}
.result{margin-top:14px;border-radius:12px;padding:14px 16px;display:none}
.result.show{display:block;animation:fu .2s ease both}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.result.ok{background:var(--g50);border:1px solid var(--g200)}
.result.bad{background:var(--r50);border:1px solid var(--r200)}
.result.warn{background:var(--a50);border:1px solid var(--a200)}
.res-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.res-icon{font-size:20px}
.res-status{font-size:14px;font-weight:800;letter-spacing:-.3px}
.result.ok .res-status{color:var(--g600)}
.result.bad .res-status{color:var(--r600)}
.result.warn .res-status{color:var(--a600)}
.res-val{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--n900);letter-spacing:1px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.res-detail{font-size:12px;color:var(--n500);margin-top:6px;line-height:1.6}
.cp{width:30px;height:30px;border-radius:8px;border:1px solid var(--n200);background:var(--n0);color:var(--n500);
  cursor:pointer;font-size:13px;flex-shrink:0;transition:.15s}
.cp:hover{background:var(--b50);border-color:var(--b200);color:var(--b600)}
.cp.ok{background:var(--g50);color:var(--g600);border-color:var(--g200)}
.suggest{margin-top:8px;padding:8px 11px;background:rgba(255,255,255,.7);border:1px dashed var(--a200);border-radius:8px;
  font-size:12px;color:var(--a600);display:flex;align-items:center;gap:8px}
.suggest b{font-family:var(--mono);color:var(--n900)}
.hint{font-size:11px;color:var(--n400);margin-top:8px;line-height:1.6}
.toast{position:fixed;bottom:16px;left:50%;transform:translate(-50%,8px);background:var(--n900);color:#fff;
  padding:9px 16px;border-radius:10px;font-size:12px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-icon">&#x2713;</div>
    <div>
      <div class="head-t">Validador</div>
      <div class="head-s">RUT chileno y patente · sin subir documento</div>
    </div>
  </div>

  <!-- RUT -->
  <div class="card">
    <div class="card-lbl">&#x1F194; Validar RUT</div>
    <div class="in-row">
      <input class="in" id="rutIn" placeholder="12.345.678-5" autocomplete="off" spellcheck="false"
        oninput="onRut()" onkeydown="if(event.key==='Enter')validateRutUI()">
      <button class="btn" onclick="validateRutUI()">Validar</button>
    </div>
    <div class="result" id="rutRes"></div>
    <div class="hint">Verifica el dígito verificador con módulo 11. Si el DV no calza, sugiere el correcto (útil para detectar errores de transcripción).</div>
  </div>

  <!-- PATENTE -->
  <div class="card">
    <div class="card-lbl">&#x1F697; Validar Patente</div>
    <div class="in-row">
      <input class="in" id="plateIn" placeholder="FPFK-63" autocomplete="off" spellcheck="false"
        oninput="onPlate()" onkeydown="if(event.key==='Enter')validatePlateUI()">
      <button class="btn" onclick="validatePlateUI()">Validar</button>
    </div>
    <div class="result" id="plateRes"></div>
    <div class="hint">Acepta formatos chilenos: LLLL-NN (autos nuevos), LLL-NNN y LL-NNNN (antiguos).</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── RUT ───────────────────────────────────────────
function cleanRut(v){return String(v||'').replace(/\./g,'').replace(/\s/g,'').replace(/-/g,'').toUpperCase();}
function rutDV(body){
  let sum=0,mul=2;
  for(let i=String(body).length-1;i>=0;i--){ sum+=parseInt(String(body)[i],10)*mul; mul=mul===7?2:mul+1; }
  const res=11-(sum%11);
  return res===11?'0':res===10?'K':String(res);
}
function fmtRut(body,dv){
  const r=String(body).split('').reverse().join('').replace(/(\d{3})(?=\d)/g,'$1.').split('').reverse().join('');
  return r+'-'+dv;
}
function validateRutUI(){
  const raw=document.getElementById('rutIn').value;
  const box=document.getElementById('rutRes');
  const s=cleanRut(raw);
  const m=s.match(/^(\d{7,8})([\dK])$/);
  if(!m){
    box.className='result show warn';
    box.innerHTML='<div class="res-top"><span class="res-icon">&#x26A0;&#xFE0F;</span><span class="res-status">Formato no reconocido</span></div>'+
      '<div class="res-detail">Ingresa 7 u 8 dígitos seguidos del dígito verificador. Ej: <b>12345678-5</b></div>';
    return;
  }
  const body=m[1], dvGiven=m[2], dvOk=rutDV(body);
  if(dvGiven===dvOk){
    const f=fmtRut(body,dvGiven);
    box.className='result show ok';
    box.innerHTML='<div class="res-top"><span class="res-icon">&#x2705;</span><span class="res-status">RUT válido</span></div>'+
      '<div class="res-val">'+f+'<button class="cp" onclick="copy(\''+f+'\',this)">&#x29C9;</button></div>';
  } else {
    const f=fmtRut(body,dvOk);
    box.className='result show bad';
    box.innerHTML='<div class="res-top"><span class="res-icon">&#x1F6D1;</span><span class="res-status">Dígito verificador incorrecto</span></div>'+
      '<div class="res-detail">El DV ingresado es <b>'+dvGiven+'</b> pero debería ser <b>'+dvOk+'</b>.</div>'+
      '<div class="suggest"><span>RUT correcto:</span><b>'+f+'</b><button class="cp" onclick="copy(\''+f+'\',this)">&#x29C9;</button></div>';
  }
}
function onRut(){ const b=document.getElementById('rutRes'); if(b.classList.contains('show')){ validateRutUI(); } }

// ── PATENTE ───────────────────────────────────────
function validatePlateUI(){
  const raw=document.getElementById('plateIn').value;
  const box=document.getElementById('plateRes');
  const p=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'');
  let norm=null, tipo='';
  let m;
  if((m=p.match(/^([A-Z]{4})(\d{2})$/))){ norm=m[1]+'-'+m[2]; tipo='Formato LLLL-NN (vehículo moderno)'; }
  else if((m=p.match(/^([A-Z]{3})(\d{3})$/))){ norm=m[1]+'-'+m[2]; tipo='Formato LLL-NNN'; }
  else if((m=p.match(/^([A-Z]{2})(\d{4})$/))){ norm=m[1]+'-'+m[2]; tipo='Formato LL-NNNN (antiguo)'; }
  if(norm){
    box.className='result show ok';
    box.innerHTML='<div class="res-top"><span class="res-icon">&#x2705;</span><span class="res-status">Patente válida</span></div>'+
      '<div class="res-val">'+norm+'<button class="cp" onclick="copy(\''+norm+'\',this)">&#x29C9;</button></div>'+
      '<div class="res-detail">'+tipo+'</div>';
  } else {
    box.className='result show bad';
    box.innerHTML='<div class="res-top"><span class="res-icon">&#x1F6D1;</span><span class="res-status">Formato inválido</span></div>'+
      '<div class="res-detail">No corresponde a un formato de patente chilena (LLLL-NN, LLL-NNN o LL-NNNN).</div>';
  }
}
function onPlate(){ const b=document.getElementById('plateRes'); if(b.classList.contains('show')){ validatePlateUI(); } }

// ── HELPERS ───────────────────────────────────────
function copy(txt,btn){
  navigator.clipboard.writeText(txt).then(()=>{ flash(btn); }).catch(()=>{
    const ta=Object.assign(document.createElement('textarea'),{value:txt,style:'position:fixed;opacity:0'});
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); flash(btn);
  });
}
function flash(btn){ if(btn){ btn.classList.add('ok'); btn.innerHTML='&#x2713;'; setTimeout(()=>{ btn.classList.remove('ok'); btn.innerHTML='&#x29C9;'; },1200); } toast('Copiado'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
</script>
</body>
</html>
