<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'IBM Plex Sans',sans-serif;background:#f5f7f5;color:#0d1f12;overflow:hidden}
:root{
  --bg:#f5f7f5;--bg2:#fff;--bg3:#f0f4f1;--bg4:#e8ede9;
  --border:#d4e0d6;--border2:#b8ccbb;
  --text:#0d1f12;--text2:#3d5c43;--text3:#7a9c80;
  --green:#00a060;--green3:rgba(0,160,96,.08);
  --amber:#c47f00;--red:#c0392b;--blue:#1a6bb5;
  --black:#0d1f12;--mono:'IBM Plex Mono',monospace;
}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.hub-shell{display:flex;flex-direction:column;flex:1;overflow:hidden}
.hub-header{background:var(--black);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--green);flex-shrink:0}
.hub-left{display:flex;align-items:center;gap:14px}
.hub-k{width:34px;height:34px;background:var(--green);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;font-family:var(--mono)}
.hub-title{font-size:16px;font-weight:700;color:#fff;font-family:var(--mono);letter-spacing:-.3px}
.hub-sub{font-size:11px;color:rgba(255,255,255,.4);font-family:var(--mono);margin-top:1px}
.hub-sep{width:1px;height:28px;background:rgba(255,255,255,.1)}
.hub-badge{padding:3px 10px;border-radius:4px;border:1px solid rgba(0,160,96,.4);background:rgba(0,160,96,.1);font-size:10px;font-weight:700;color:var(--green);font-family:var(--mono);letter-spacing:.5px}
.hub-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hub-ver{font-size:11px;color:rgba(255,255,255,.4);font-family:var(--mono);display:flex;align-items:center;gap:8px}
.hub-body{display:grid;grid-template-columns:240px 1fr;flex:1;overflow:hidden}
.hub-sidebar{background:var(--black);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid rgba(255,255,255,.06)}
.hs-sec{padding:18px 16px 6px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.25);font-family:var(--mono)}
.hs-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:all .15s;border-left:2px solid transparent;margin:1px 0}

.hs-item.active{background:rgba(0,160,96,.08);border-left-color:var(--green)}
.hs-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.hs-info{flex:1;min-width:0}
.hs-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.7);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-item.active .hs-name{color:#fff}
.hs-desc{font-size:10px;color:rgba(255,255,255,.3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;font-family:var(--mono);flex-shrink:0;border:1px solid}
.hs-div{height:1px;background:rgba(255,255,255,.06);margin:6px 16px}
.hs-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);margin-top:auto}
.hs-ver{font-size:9px;color:rgba(255,255,255,.18);font-family:var(--mono);text-align:center;line-height:1.9}
.hub-main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.home-view{flex:1;overflow-y:auto;padding:28px 36px}
.hw-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;background:var(--green3);border:1px solid rgba(0,160,96,.2);border-radius:20px;font-size:10px;font-weight:700;color:var(--green);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.hw-title{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-1px;line-height:1.2;margin-bottom:6px}
.hw-title span{color:var(--green)}
.hw-sub{font-size:12px;color:var(--text2);max-width:460px;line-height:1.6;margin-bottom:28px}
.stats-row{display:flex;gap:10px;margin-bottom:28px}
.stat-card{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px}
.stat-n{font-size:22px;font-weight:700;color:var(--text);font-family:var(--mono);letter-spacing:-1px;margin-bottom:2px}
.stat-n span{font-size:12px;font-weight:400;color:var(--text3)}
.stat-l{font-size:11px;color:var(--text2)}
.section-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px;font-family:var(--mono)}
.section-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:28px}
.tool-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.tool-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--green3) 0%,transparent 60%);opacity:0;transition:opacity .2s;pointer-events:none}
.tool-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,160,96,.08)}
.tool-card:hover::before{opacity:1}
.tc-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}

.tc-badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tc-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;border:1px solid}
.tc-name{font-size:15px;font-weight:700;color:var(--text);font-family:var(--mono);margin-bottom:4px}
.tc-desc{font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.tc-feats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.tc-feat{display:flex;align-items:center;gap:4px;padding:2px 7px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;font-size:10px;color:var(--text2)}
.tc-feat-dot{width:5px;height:5px;border-radius:50%}
.tc-foot{display:flex;align-items:center;justify-content:space-between}
.tc-ver{font-size:10px;color:var(--text3);font-family:var(--mono)}
.tc-btn{display:flex;align-items:center;gap:5px;padding:6px 13px;background:var(--black);border-radius:6px;font-size:11px;font-weight:700;color:#fff;font-family:var(--mono);transition:background .15s}
.tool-card:hover .tc-btn{background:var(--green)}
.changelog{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:32px}
.cl-entry{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.cl-entry:last-child{border-bottom:none}
.cl-date{font-size:10px;color:var(--text3);font-family:var(--mono);width:76px;flex-shrink:0;padding-top:1px}
.cl-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.3px;border:1px solid;margin-right:5px}
.cl-text{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.5}
.tool-topbar{height:44px;background:var(--black);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;border-bottom:2px solid var(--green)}
.tb-back{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.6);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--mono)}
.tb-back:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.2)}
.tb-name{font-size:12px;font-weight:700;color:#fff;font-family:var(--mono);flex:1}
.tb-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;border:1px solid}
.tool-content{flex:1;overflow:hidden;display:flex;flex-direction:column}
</style>
